<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RegexForge — Interactive Regular Expression Compiler{% endblock %}</title>
  <meta name="description" content="RegexForge - Interactive Regular Expression Compiler with Thompson NFA, Subset DFA, and Execution Trace Matcher.">
  
  <!-- Official Favicon -->
  <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='images/favicon.jpg') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/favicon.jpg') }}">

  <!-- Persistent Theme Early Initialization -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('regexforge-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <!-- Tailwind CSS CDN & Extensions -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "background": "var(--bg-dark)",
            "surface": "var(--bg-surface)",
            "on-surface": "var(--text-primary)",
            "on-surface-variant": "var(--text-secondary)",
            "primary": "var(--accent-indigo)",
            "secondary": "var(--text-secondary)",
            "error": "var(--accent-rose)"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.75rem",
            "xl": "1rem",
            "full": "9999px"
          },
          "spacing": {
            "panel-gap": "1rem",
            "container-padding": "2rem",
            "gutter": "1.5rem",
            "element-stack": "0.5rem"
          },
          "fontFamily": {
            "label-caps": ["JetBrains Mono", "monospace"],
            "body-md": ["Hanken Grotesk", "sans-serif"],
            "display-lg": ["Hanken Grotesk", "sans-serif"],
            "headline-md": ["Hanken Grotesk", "sans-serif"],
            "code-lg": ["JetBrains Mono", "monospace"],
            "code-sm": ["JetBrains Mono", "monospace"]
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- Custom CSS Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  
  <!-- Cytoscape.js for Automata Graph Rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md text-body-md antialiased overflow-x-hidden transition-colors duration-300">
  
  <!-- Background Noise Overlay -->
  <div class="noise-overlay"></div>

  <!-- Top Navigation Bar -->
  <header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-[30px] border-b border-black/5 dark:border-white/10 shadow-[0_20px_40px_rgba(0,0,0,0.15)] transition-colors duration-300">
    <div class="flex justify-between items-center px-6 h-16 w-full max-w-[1440px] mx-auto">
      <div class="flex items-center gap-8">
        <a class="font-headline-md text-headline-md font-bold text-on-surface tracking-tight flex items-center gap-2.5 group" href="/">
          <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="RegexForge Logo" class="w-8 h-8 rounded-lg object-cover shadow-sm group-hover:scale-105 transition-transform duration-300">
          <span class="text-gradient">RegexForge</span>
        </a>
        <nav class="hidden md:flex items-center gap-2 font-label-caps text-label-caps">
          <a class="nav-link" href="/">Home</a>
          <a class="nav-link" href="/workspace">Workspace</a>
          <a class="nav-link" href="/analyzer">Analyzer</a>
          <a class="nav-link" href="/nfa">NFA</a>
          <a class="nav-link" href="/dfa">DFA</a>
          <a class="nav-link" href="/testing">Testing</a>
          <a class="nav-link" href="/how-it-works">How It Works</a>
          <a class="nav-link" href="/about">About</a>
        </nav>
      </div>
      <div class="flex items-center gap-3 font-label-caps text-label-caps">
        <button id="theme-toggle-btn" class="p-2 rounded-full border border-black/10 dark:border-white/10 hover:bg-black/5 dark:hover:bg-white/10 text-on-surface-variant hover:text-on-surface transition-all duration-300 flex items-center justify-center" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">
          <span id="theme-toggle-icon" class="material-symbols-outlined text-[20px]">dark_mode</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Wrapper -->
  <main class="flex-grow pt-24 pb-12 px-container-padding max-w-[1440px] mx-auto w-full animate-fade-in">
    {% block content %}{% endblock %}
  </main>

  <!-- Examples Modal -->
  <div id="examples-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="panel-header">
        <h3 class="panel-title flex items-center gap-2">
          <span class="material-symbols-outlined text-primary">library_books</span>
          Standard Regex Examples
        </h3>
        <button id="btn-close-modal" class="btn btn-secondary btn-sm">✕ Close</button>
      </div>
      <div id="examples-list" class="flex flex-col gap-3 max-h-[400px] overflow-y-auto pr-1">
        <!-- Dynamic example cards populated via JavaScript -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="w-full mt-auto bg-background/90 backdrop-blur-md border-t border-black/5 dark:border-white/5 py-6 transition-colors duration-300">
    <div class="flex flex-col sm:flex-row justify-between items-center px-8 w-full max-w-[1440px] mx-auto gap-3 text-xs text-on-surface-variant">
      <div class="flex items-center gap-2">
        <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="RegexForge Logo" class="w-4 h-4 rounded-sm object-cover">
        <span class="font-bold text-on-surface">RegexForge</span>
        <span>— Interactive Regular Expression Compiler</span>
      </div>
      <div>
        <a href="/about" class="text-primary hover:underline font-medium">Academic Info &amp; Team Details →</a>
      </div>
    </div>
  </footer>

  <!-- Core JavaScript Scripts -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/graph.js') }}"></script>
  <script src="{{ url_for('static', filename='js/visualizer.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
